<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analyzing... - Email Scraper</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="analyzing-container">
        <div class="spinner" id="spinner"></div>
        <h2 id="title">Analyzing your inbox...</h2>
        <div class="email-info">
            <strong>{{ email }}</strong><br>
            Last {{ days }} day{% if days > 1 %}s{% endif %}
        </div>
        <div class="progress-text" id="progressText">Connecting to email server...</div>
        <div class="helper-text" id="helperText">
            This may take a moment. Please wait.
            {% if days == 1 %}
            <br>Usually takes 10-30 seconds
            {% else %}
            <br>May take 1-2 minutes for larger inboxes
            {% endif %}
        </div>
        <div id="errorMessage" class="error-message hidden"></div>
        <a href="/" class="button hidden" id="retryButton">Try Again</a>
    </div>

    <script>
        // Auto-redirect to API endpoint which will render results
        window.onload = function() {
            const progressText = document.getElementById('progressText');
            progressText.textContent = 'Analyzing emails...';
            
            // Redirect to API analysis endpoint
            setTimeout(() => {
                window.location.href = '/results';
            }, 1000);
        };
    </script>
</body>
</html>
